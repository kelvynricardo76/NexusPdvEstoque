spring:
  application:
    name: nexus-pdv
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  h2:
    console:
      enabled: false
  mvc:
    problemdetails:
      enabled: false
  web:
    locale: pt_BR
    locale-resolver: fixed
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        name: NEXUS_SESSION
        http-only: true
        same-site: lax
        secure: ${NEXUS_SECURE_COOKIES:false}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Nexus PDV & Estoque
    vendor: Nexus Development

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

nexus:
  security:
    dev-tools: false
    login:
      max-attempts-per-email: 5
      max-attempts-per-ip: 50
      lock-minutes: 15
    rate-limit:
      enabled: true
      requests-per-minute: 600
    cors:
      allowed-origins: ${NEXUS_CORS_ALLOWED_ORIGINS:}
    password-reset:
      token-ttl-minutes: 30
      frontend-base-url: ${NEXUS_FRONTEND_URL:http://localhost:4200}
      log-links: false
  bootstrap:
    admin-name: ${NEXUS_BOOTSTRAP_ADMIN_NAME:Administrador Nexus}
    admin-email: ${NEXUS_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${NEXUS_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
