# Perfil de testes — H2 em memória, isolado por contexto.
spring:
  datasource:
    url: jdbc:h2:mem:nexus-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:

nexus:
  scheduling:
    enabled: false
  security:
    login:
      # Todos os testes compartilham o IP 127.0.0.1; o limite por IP é testado isoladamente.
      max-attempts-per-ip: 100000
    rate-limit:
      enabled: false

logging:
  level:
    com.nexus.pdv: INFO
